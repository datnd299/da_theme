<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Veterangift</title>
  <desc id="logo-desc">Veterangift website logo with a shirt icon and wordmark.</desc>
  <defs>
    <linearGradient id="sgs-badge" x1="6" y1="8" x2="74" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#d6b66f"/>
    </linearGradient>
    <linearGradient id="sgs-shirt" x1="20" y1="19" x2="59" y2="63" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="sgs-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020817" flood-opacity="0.26"/>
    </filter>
  </defs>

  <g filter="url(#sgs-shadow)">
    <circle cx="40" cy="40" r="34" fill="#0b1f3a"/>
    <circle cx="40" cy="40" r="29.5" fill="none" stroke="url(#sgs-badge)" stroke-width="4"/>
    <path d="M27.8 20.8h7.3c1.3 2.5 3 3.7 4.9 3.7s3.6-1.2 4.9-3.7h7.3l10.1 8.5-6 8-5-3.6v25.5H28.7V33.7l-5 3.6-6-8 10.1-8.5Z" fill="url(#sgs-shirt)"/>
    <path d="M35.1 20.8c1.3 2.5 3 3.7 4.9 3.7s3.6-1.2 4.9-3.7" fill="none" stroke="#b31942" stroke-width="3" stroke-linecap="round"/>
    <path d="M31.9 40.6h16.2m-16.2 7.4h12.9" fill="none" stroke="#b31942" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <g>
    <text x="88" y="45" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="900" letter-spacing="0">
      Veterangift<tspan fill="#d6b66f" font-size="17">.com</tspan>
    </text>
    <path d="M88 59h138" fill="none" stroke="#b31942" stroke-width="4" stroke-linecap="round"/>
    <path d="M236 59h47" fill="none" stroke="#d6b66f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
