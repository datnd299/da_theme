  <!-- length -->
  <g stroke="#0A3161" stroke-width="2" stroke-linecap="round">
    <path d="M30 60 V298 M24 68 L30 60 L36 68 M24 290 L30 298 L36 290"/>
  </g>
  <rect x="8" y="168" width="44" height="22" fill="#FFFFFF"/>
