<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" fill="none" font-family="Barlow, Arial, sans-serif" font-weight="800" font-size="13">
  <!-- camp-collar shirt -->
  <g stroke="#0A3161" stroke-width="2.5" stroke-linejoin="round" fill="#FFFFFF">
    <path d="M110 58 L160 40 L180 62 L200 40 L250 58 L304 120 L272 148 L248 122 L250 296 L110 296 L112 122 L88 148 L56 120 Z"/>
    <path d="M160 40 L148 76 L180 104 L212 76 L200 40" fill="#EEF2F8"/>
    <path d="M180 104 V296" stroke-width="2"/>
  </g>
  <g fill="#0A3161"><circle cx="186" cy="140" r="3"/><circle cx="186" cy="180" r="3"/><circle cx="186" cy="220" r="3"/><circle cx="186" cy="260" r="3"/></g>
  <!-- hibiscus hints -->
  <g fill="#BFD5F0"><circle cx="138" cy="170" r="10"/><circle cx="228" cy="210" r="12"/><circle cx="140" cy="250" r="8"/><circle cx="226" cy="140" r="7"/></g>
  <!-- A: shoulder -->
  <g stroke="#0A3161" stroke-width="2" stroke-linecap="round">
    <path d="M110 22 H250 M118 16 L110 22 L118 28 M242 16 L250 22 L242 28"/>
    <path d="M110 28 V56 M250 28 V56" stroke-dasharray="3 4" stroke-width="1.5" opacity=".55"/>
  </g>
  <rect x="146" y="13" width="68" height="18" fill="#FFFFFF"/>
  <text x="180" y="27" fill="#0A3161" text-anchor="middle">SHOULDER</text>
  <!-- B: bust -->
  <path d="M116 160 H244" stroke="#0A3161" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="152" y="154" fill="#0A3161" text-anchor="middle" font-size="12">B</text>
  <!-- C: sleeve -->
  <path d="M260 66 L306 120" stroke="#0A3161" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="296" y="84" fill="#0A3161" font-size="12">C</text>
  <!-- D: length -->
  <g stroke="#0A3161" stroke-width="2" stroke-linecap="round">
    <path d="M332 44 V296 M326 52 L332 44 L338 52 M326 288 L332 296 L338 288"/>
  </g>
  <rect x="320" y="150" width="24" height="56" fill="#FFFFFF"/>
  <text x="332" y="178" fill="#0A3161" text-anchor="middle" font-size="11" transform="rotate(90 332 178)">LENGTH</text>
</svg>
