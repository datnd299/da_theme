<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="wt wd">
  <title id="wt">The atelier bench</title>
  <desc id="wd">A watchmaker's bench: a loupe over a movement in its holder, tweezers, screwdrivers and a parts tray.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F5"/>
      <stop offset="1" stop-color="#F2EEE6"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E1D2"/>
      <stop offset="1" stop-color="#D8CFBB"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDEBE6"/>
      <stop offset="0.5" stop-color="#B9B6AF"/>
      <stop offset="1" stop-color="#DCDAD4"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFDCB2"/>
      <stop offset="0.5" stop-color="#B08D4F"/>
      <stop offset="1" stop-color="#8E7333"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#wall)"/>

  <!-- tool rail on the wall -->
  <line x1="72" y1="96" x2="568" y2="96" stroke="#C9C0B1" stroke-width="1.5"/>
  <g stroke="url(#tool)" stroke-width="7" stroke-linecap="round">
    <line x1="108" y1="98" x2="108" y2="176"/>
    <line x1="136" y1="98" x2="136" y2="192"/>
    <line x1="164" y1="98" x2="164" y2="164"/>
  </g>
  <g fill="#B08D4F">
    <circle cx="108" cy="180" r="4"/><circle cx="136" cy="196" r="4"/><circle cx="164" cy="168" r="4"/>
  </g>

  <!-- parts tray -->
  <g>
    <ellipse cx="520" cy="196" rx="62" ry="20" fill="none" stroke="#C9C0B1" stroke-width="1.4"/>
    <ellipse cx="520" cy="192" rx="44" ry="13" fill="none" stroke="#C9C0B1" stroke-width="1"/>
    <circle cx="500" cy="190" r="4" fill="#B08D4F"/>
    <circle cx="518" cy="194" r="3" fill="#B08D4F"/>
    <circle cx="536" cy="188" r="3.4" fill="#B08D4F"/>
  </g>

  <!-- bench top -->
  <rect x="0" y="330" width="640" height="150" fill="url(#top)"/>
  <line x1="0" y1="330" x2="640" y2="330" stroke="#BFB49E" stroke-width="1.5"/>
  <ellipse cx="300" cy="332" rx="150" ry="14" fill="rgba(26,26,24,0.07)"/>

  <!-- movement in its holder -->
  <g>
    <rect x="238" y="300" width="124" height="30" rx="4" fill="#1F1F1A"/>
    <rect x="252" y="292" width="96" height="12" rx="3" fill="#2C2C25"/>
    <circle cx="300" cy="244" r="56" fill="#EFEADF" stroke="#B3A98F" stroke-width="1.5"/>
    <circle cx="300" cy="244" r="46" fill="none" stroke="rgba(120,110,88,0.35)" stroke-width="1"/>
    <path d="M254 244 A46 46 0 0 1 346 244 Z" fill="url(#brass)" opacity="0.4"/>
    <circle cx="300" cy="244" r="12" fill="url(#brass)" stroke="#8E7333" stroke-width="1"/>
    <circle cx="300" cy="244" r="4" fill="#EFEADF"/>
    <circle cx="272" cy="270" r="9" fill="none" stroke="#8E7333" stroke-width="1.2"/>
    <circle cx="330" cy="272" r="7" fill="none" stroke="#8E7333" stroke-width="1.2"/>
    <circle cx="272" cy="270" r="2.4" fill="#B03A3A"/>
    <circle cx="330" cy="272" r="2" fill="#B03A3A"/>
  </g>

  <!-- loupe on its stand, angled over the movement -->
  <g>
    <path d="M300 244 m-96 -70 a96 96 0 0 1 30 -34" fill="none" stroke="none"/>
    <circle cx="300" cy="200" r="112" fill="none" stroke="#1A1A18" stroke-width="3"/>
    <circle cx="300" cy="200" r="103" fill="rgba(176,141,79,0.08)" stroke="#B08D4F" stroke-width="1.2"/>
    <path d="M212 132 a112 112 0 0 1 44 -34" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="8" stroke-linecap="round"/>
    <path d="M300 88 v-24" stroke="#1A1A18" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="60" r="7" fill="#1A1A18"/>
  </g>

  <!-- tweezers and screwdriver on the bench -->
  <g stroke-linecap="round">
    <path d="M424 356 l112 -34" stroke="url(#tool)" stroke-width="7"/>
    <path d="M424 362 l112 -22" stroke="url(#tool)" stroke-width="7"/>
    <circle cx="540" cy="326" r="4" fill="#8E8B84"/>
    <path d="M78 372 l104 -14" stroke="url(#brass)" stroke-width="10"/>
    <path d="M182 358 l40 -6" stroke="url(#tool)" stroke-width="5"/>
  </g>

  <!-- serial card -->
  <g>
    <rect x="238" y="384" width="164" height="56" rx="3" fill="#FBFAF7" stroke="#C9C0B1" stroke-width="1"/>
    <line x1="258" y1="404" x2="382" y2="404" stroke="#C9C0B1" stroke-width="1"/>
    <line x1="258" y1="418" x2="344" y2="418" stroke="#E3DDD2" stroke-width="1"/>
    <text x="258" y="436" font-family="Jost, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.6" fill="#7A5F2E">CHRONEL</text>
  </g>
</svg>
