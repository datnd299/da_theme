    :root {

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 auto 24px;
      max-width: 1320px;
    }

      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: #64748b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      max-width: 1320px;
      margin: 0 auto;
    }

    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid #d8dee9;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    a {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background:
        linear-gradient(45deg, #edf2f7 25%, transparent 25%),
        linear-gradient(-45deg, #edf2f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf2f7 75%),
        linear-gradient(-45deg, transparent 75%, #edf2f7 75%);
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    figcaption {
      min-height: 76px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }

    .folder {
      display: block;
      margin-bottom: 5px;
      color: #0f766e;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: 11px;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      header {
        display: block;
      }
    }
