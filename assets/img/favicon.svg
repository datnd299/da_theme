<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="favicon-title favicon-desc">
  <title id="favicon-title">Veterangift favicon</title>
  <desc id="favicon-desc">A navy circular badge with a graphic shirt icon.</desc>
  <defs>
    <linearGradient id="badge-ring" x1="92" y1="76" x2="420" y2="436" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#d6b66f"/>
    </linearGradient>
    <linearGradient id="shirt-fill" x1="156" y1="132" x2="356" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020817" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0b1f3a"/>
  <g filter="url(#badge-shadow)">
    <circle cx="256" cy="256" r="192" fill="#0b1f3a"/>
    <circle cx="256" cy="256" r="166" fill="none" stroke="url(#badge-ring)" stroke-width="28"/>
    <path d="M186 142h42c7 14 17 21 28 21s21-7 28-21h42l58 49-35 46-28-20v153H191V217l-28 20-35-46 58-49Z" fill="url(#shirt-fill)"/>
    <path d="M228 142c7 14 17 21 28 21s21-7 28-21" fill="none" stroke="#b31942" stroke-width="22" stroke-linecap="round"/>
    <path d="M211 257h90m-90 48h72" fill="none" stroke="#b31942" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
